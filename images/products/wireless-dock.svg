    <circle cx="95" cy="110" r="32" fill="none" stroke="#00E5FF" stroke-width="3" stroke-dasharray="8 6"/>
    <!-- Watch Stand Pad -->
    <circle cx="210" cy="110" r="30" fill="#3B4252" stroke="#88C0D0" stroke-width="2"/>
    <!-- Earbuds Charging Indentation -->
