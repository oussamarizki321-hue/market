  <rect width="600" height="600" fill="url(#bg)"/>
  <g transform="translate(30, 30)"><rect width="90" height="26" rx="4" fill="#E60000"/><text x="45" y="18" fill="#FFF" font-family="Arial" font-weight="900" font-size="13" text-anchor="middle">Choice</text></g>
  <g transform="translate(420, 30)"><rect width="150" height="26" rx="13" fill="#EEF2F6" stroke="#D0D7DE"/><text x="495" y="17" fill="#24292F" font-family="Arial" font-weight="700" font-size="11" text-anchor="middle">Waterproof â€¢ Windproof</text></g>
