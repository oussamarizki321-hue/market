<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#F2F4F7"/>
      <stop offset="100%" stop-color="#E5E8EB"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C3437"/>
      <stop offset="50%" stop-color="#1B1F23"/>
      <stop offset="100%" stop-color="#0F1113"/>
    </linearGradient>
    <linearGradient id="ledGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0080FF"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3838"/>
      <stop offset="100%" stop-color="#E60000"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- Choice Badge -->
  <g transform="translate(30, 30)">
    <rect width="90" height="26" rx="4" fill="url(#badgeGrad)"/>
    <text x="45" y="18" fill="#FFF" font-family="Arial, sans-serif" font-weight="900" font-size="13" text-anchor="middle">Choice</text>
  </g>

  <!-- Spec Tag -->
  <g transform="translate(420, 30)">
    <rect width="150" height="26" rx="13" fill="#EEF2F6" stroke="#D0D7DE"/>
    <text x="495" y="17" fill="#24292F" font-family="Arial, sans-serif" font-weight="700" font-size="11" text-anchor="middle">Bluetooth 5.3 • HiFi</text>
  </g>

  <!-- Shadow below Case -->
  <ellipse cx="300" cy="460" rx="180" ry="24" fill="#000000" opacity="0.12" filter="blur(8px)"/>

  <!-- Earbuds Charging Case Base -->
  <g filter="url(#shadow)">
    <!-- Main Capsule Case -->
    <rect x="180" y="240" width="240" height="190" rx="60" fill="url(#caseGrad)"/>
    <rect x="185" y="245" width="230" height="180" rx="55" fill="none" stroke="#48535A" stroke-width="1.5" opacity="0.5"/>

    <!-- Case Open Cut Line -->
    <path d="M 180 320 Q 300 335 420 320" stroke="#0A0C0E" stroke-width="3" fill="none"/>
    <path d="M 180 322 Q 300 337 420 322" stroke="#4E5A63" stroke-width="1" fill="none" opacity="0.6"/>

    <!-- Digital Battery LED Display Window -->
    <rect x="250" y="348" width="100" height="42" rx="8" fill="#050708" stroke="#252A2E"/>
    <text x="290" y="377" fill="url(#ledGrad)" font-family="'Courier New', monospace" font-weight="900" font-size="24" text-anchor="middle">98</text>
    <text x="318" y="370" fill="url(#ledGrad)" font-family="Arial, sans-serif" font-weight="700" font-size="12">%</text>
    <circle cx="264" cy="369" r="3" fill="#00F0FF"/>
    <circle cx="336" cy="369" r="3" fill="#00F0FF"/>

    <!-- Lenovo Thinkplus Branding -->
    <text x="300" y="414" fill="#8B949E" font-family="Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="2" text-anchor="middle">THINKPLUS</text>
  </g>

  <!-- Left Earbud Floating Outside Case -->
  <g transform="translate(130, 110) rotate(-15)" filter="url(#shadow)">
    <!-- Earbud Stem -->
    <rect x="40" y="70" width="18" height="90" rx="9" fill="url(#caseGrad)"/>
    <rect x="44" y="145" width="10" height="4" rx="2" fill="#D0D7DE"/>
    <!-- Earbud Head -->
    <circle cx="49" cy="65" r="28" fill="url(#caseGrad)"/>
    <ellipse cx="65" cy="60" rx="16" ry="20" fill="#3A444C"/>
    <!-- Touch Sensor Indicator -->
    <circle cx="49" cy="85" r="5" fill="#00F0FF" opacity="0.8"/>
  </g>

  <!-- Right Earbud Floating Outside Case -->
  <g transform="translate(370, 95) rotate(18)" filter="url(#shadow)">
    <!-- Earbud Stem -->
    <rect x="40" y="70" width="18" height="90" rx="9" fill="url(#caseGrad)"/>
    <rect x="44" y="145" width="10" height="4" rx="2" fill="#D0D7DE"/>
    <!-- Earbud Head -->
    <circle cx="49" cy="65" r="28" fill="url(#caseGrad)"/>
    <ellipse cx="33" cy="60" rx="16" ry="20" fill="#3A444C"/>
    <!-- Touch Sensor Indicator -->
    <circle cx="49" cy="85" r="5" fill="#00F0FF" opacity="0.8"/>
  </g>

  <!-- Soundwave accents -->
  <path d="M 80 180 Q 95 195 80 210" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 68 170 Q 90 195 68 220" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 520 180 Q 505 195 520 210" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 532 170 Q 510 195 532 220" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
</svg>
