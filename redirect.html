<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecting to AliExpress...</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      background-color: #F8F9FA;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .redirect-box {
      background-color: #FFFFFF;
      border-radius: 12px;
      padding: 36px;
      max-width: 460px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid #E5E7EB;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #F3F4F6;
      border-top-color: #FF4747;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="redirect-box">
    <div style="font-size: 26px; font-weight: 800; color: #FF4747; margin-bottom: 8px;">
      Ali<span style="color: #111;">Market</span>
    </div>
    <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 8px;" id="status-title">
      Redirecting to AliExpress...
    </h3>
    <p style="font-size: 13.5px; color: #666; margin-bottom: 16px;" id="item-title">
      Connecting to official authorized seller page with tracked pricing.
    </p>

    <div class="spinner"></div>

    <div style="margin-top: 20px;">
      <a id="manual-link" href="#" class="btn-proceed-aliexpress" style="display: none; text-decoration: none;">
        Click here if not redirected automatically
      </a>
    </div>

    <div style="font-size: 11.5px; color: #888; margin-top: 20px;">
      Official AliExpress Affiliate Referral Link • 75-Day Buyer Protection
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/tracker.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get("id");
      const targetParam = urlParams.get("url");

      let targetUrl = "https://www.aliexpress.com";
      let product = null;

      if (productId && window.Store) {
        product = window.Store.getProductById(productId);
        if (product) {
          document.getElementById("item-title").textContent = product.name.en || product.name;
          window.Store.logAffiliateClick(product, "direct_redirect_page");
          targetUrl = window.Tracker ? window.Tracker.buildAffiliateUrl(product.affiliateUrl, product.id) : product.affiliateUrl;
        }
      } else if (targetParam) {
        targetUrl = targetParam;
      }

      const manualLink = document.getElementById("manual-link");
      manualLink.href = targetUrl;
      manualLink.style.display = "inline-flex";

      // Execute redirection
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 1000);
    });
  </script>
</body>
</html>
